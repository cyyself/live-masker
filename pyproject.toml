[project]
name = "live-masker"
version = "0.1.0"
description = "Privacy-masking RTMP relay: blur faces and phone screens with a GPU, forward to multiple platforms"
readme = "README.md"
authors = [
    { name = "Yangyu Chen", email = "cyy@cyyself.name" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=18.1.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pyyaml>=6.0.3",
    "ultralytics>=8.4.164",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
live-masker = "live_masker.app:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
