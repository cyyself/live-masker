# HAProxy on the cloud server (public IPv4) -> VPN -> live-masker host.
#
# 192.0.2.10 below is a placeholder: replace it with the live-masker host's server.bind_ip
# (see data/config.json), e.g.  sed -i s/192.0.2.10/<your-ip>/g haproxy.cfg
# The live-masker host only listens on its private IPv4 (server.bind_ip), never on IPv6.
# Do NOT run this HAProxy on the live-masker host itself: mediamtx grants full rights to
# connections from 127.0.0.1, and a local proxy would make every client look local.
#
# After deploying, set "Public host" in the web UI (Glasses ingest card) to this server's
# DNS name / IPv4 so the UI shows the right ingest URL and WebRTC advertises it.

global
    log /dev/log local0
    maxconn 4096
    # tls defaults
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log     global
    option  tcplog
    timeout connect 5s
    # live streams are long-lived connections
    timeout client  1h
    timeout server  1h
    timeout tunnel  24h
    option  tcpka

# ---------------------------------------------------------------- glasses ingest (RTMP)
frontend rtmp_in
    mode tcp
    bind 0.0.0.0:1935
    default_backend live_masker_rtmp

backend live_masker_rtmp
    mode tcp
    server masker 192.0.2.10:1935 check inter 5s

# Optional RTMPS ingest (TLS terminated here), if your glasses accept rtmps:// URLs.
# Keeps the stream key off the wire in plain text.
# frontend rtmps_in
#     mode tcp
#     bind 0.0.0.0:1936 ssl crt /etc/haproxy/certs/masker.pem
#     default_backend live_masker_rtmp

# ---------------------------------------------------------------- web UI (HTTPS)
# The UI uses HTTP basic auth: always put TLS in front of it on the public internet.
frontend web_in
    mode http
    option httplog
    bind 0.0.0.0:443 ssl crt /etc/haproxy/certs/masker.pem alpn h2,http/1.1
    bind 0.0.0.0:80
    http-request redirect scheme https code 301 unless { ssl_fc }
    default_backend live_masker_web

backend live_masker_web
    mode http
    # MJPEG previews are long-running responses
    timeout server 1h
    server masker 192.0.2.10:8056 check inter 5s

# ---------------------------------------------------------------- WebRTC previews (ICE-TCP)
# HAProxy only proxies TCP, so previews use ICE over TCP here. If this fails the UI falls
# back to MJPEG over HTTPS automatically. (UDP 8189 would need a DNAT/UDP forward instead.)
frontend webrtc_in
    mode tcp
    bind 0.0.0.0:8189
    default_backend live_masker_webrtc

backend live_masker_webrtc
    mode tcp
    server masker 192.0.2.10:8189
